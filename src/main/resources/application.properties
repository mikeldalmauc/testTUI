spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev config
spring.artemis.mode=EMBEDDED
spring.artemis.host=localhost
spring.artemis.port=61616
spring.artemis.embedded.enabled=true

spring.jms.template.default-destination=dafultQueue

spring.activemq.in-memory=true
spring.activemq.pooled=false
spring.activemq.schedulerSupport=true
logging.level.org.apache.activemq.audit.base=WARN
logging.level.org.apache.activemq.audit.message=WARN

tui.activemq.orders.queue=orders
tui.activemq.kitchen.queue=kitchen

# Time in seconds oreds are queued before processing
tui.orders.waittime=300