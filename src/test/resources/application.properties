spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true


spring.activemq.in-memory=true
spring.activemq.pooled=false
spring.activemq.schedulerSupport=true

spring.artemis.mode=EMBEDDED
spring.artemis.host=localhost
spring.artemis.port=61616
spring.artemis.embedded.enabled=true

spring.jms.template.default-destination=dafultQueue

spring.h2.console.settings.web-allow-others=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

tui.activemq.orders.queue=orders
tui.activemq.kitchen.queue=kitchen
# Time in seconds the orders are queued before processing
tui.orders.waittime=4