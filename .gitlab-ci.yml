image: gitlab/dind
services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay
  SPRING_PROFILES_ACTIVE: gitlab-ci
  USER_GITLAB: mikeldalmauc
  APP_NAME: testTUI
  REPO: testTUI

stages:
  - build
  - test

maven-build:
  image: maven:3.6.3-jdk-11
  stage: build
  script: "mvn clean package -B"
  artifacts:
    paths:
      - target/*.jar

maven-test:
  image: maven:3.6.3-jdk-11
  stage: test
  script: "mvn test"
  artifacts:
    paths:
      - target/*.jar

sonarqube-check:
  image: maven:3.6.3-jdk-11
  stage: test
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - mvn sonar:sonar -D"sonar.projectKey=pruebaTUI" -D"sonar.host.url=http://835f-62-99-26-193.ngrok.io" -D"sonar.login=6a59b0f5237de142bf65109fc3ade1fd9bf42ef6"  -D"sonar.sources=./src" -D"sonar.java.binaries=./target/classes"
  allow_failure: true
  only:
    - master # or the name of your main branch